name: Build Upstream from Main & Deploy to Firebase

on:
  schedule:
    # Incremental check for new main commits every 6 hours (06:00, 12:00, 18:00 UTC)
    - cron: '0 6,12,18 * * *'
    # Full clean rebuild of all 15 apps bypassing compiler cache every 24 hours (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'App(s) to build: "auto", "all", single app (e.g. "figcraft"), or comma-separated list (e.g. "figcraft, photocraft")'
        required: true
        default: 'auto'
        type: string
      branch:
        description: 'Upstream git branch to inspect and build'
        required: false
        default: 'main'
        type: string
      force:
        description: 'Force rebuild even if no new commit is detected'
        required: false
        default: false
        type: boolean
      clean_build:
        description: 'Clean build: rebuild all 15 apps from scratch and purge compiler caches'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Deploy to Firebase Hosting after build'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [build-upstream-main]

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: write

jobs:
  check-changes:
    name: Check Upstream Main Commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      matrix: ${{ steps.check.outputs.matrix }}
      count: ${{ steps.check.outputs.count }}
      summary: ${{ steps.check.outputs.summary }}
      latest_shas: ${{ steps.check.outputs.latest_shas }}
      clean_build: ${{ steps.check.outputs.clean_build }}
    steps:
      - name: Checkout CraftApps Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for New Commits on Upstream Main
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_BUILD_FLAG=""
          if [ "${{ inputs.clean_build }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            CLEAN_BUILD_FLAG="--clean-build"
          fi
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          APP_ARG="${{ inputs.app || 'auto' }}"
          BRANCH_ARG="${{ inputs.branch || 'main' }}"
          python scripts/check-upstream-commits.py --app "$APP_ARG" --branch "$BRANCH_ARG" $FORCE_FLAG $CLEAN_BUILD_FLAG

      - name: Purge Compiler Caches for Clean Build
        if: steps.check.outputs.clean_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess, os
          try:
              res = subprocess.run(["gh", "cache", "list", "--json", "id,key"], capture_output=True, text=True, check=True)
              caches = json.loads(res.stdout) if res.stdout else []
              compiler_caches = [c for c in caches if not c["key"].startswith("craftapps-dist-")]
              print(f"Purging {len(compiler_caches)} compiler build cache(s) for clean rebuild...")
              for c in compiler_caches:
                  subprocess.run(["gh", "cache", "delete", str(c["id"])], check=False)
              print("Compiler caches successfully purged.")
          except Exception as e:
              print(f"Notice: cache purge check completed: {e}")
          PY

      - name: Report Check Summary
        run: |
          if [ "${{ steps.check.outputs.clean_build }}" = "true" ]; then
            echo "### 🧹 24h Clean Rebuild Triggered (${{ steps.check.outputs.count }} apps)" >> $GITHUB_STEP_SUMMARY
            echo "Compiler caches purged. Compiling all 15 applications from scratch from \`main\`." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "### 🚀 Upstream Build Queued (${{ steps.check.outputs.count }} app(s))" >> $GITHUB_STEP_SUMMARY
            echo "Applications to compile: **${{ steps.check.outputs.summary }}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ All Applications Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "No new commits found on \`main\` across upstream repositories. Skipping build and deployment." >> $GITHUB_STEP_SUMMARY
          fi

  build-apps:
    name: Build ${{ matrix.app }} (${{ inputs.branch || 'main' }})
    needs: [check-changes]
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-changes.outputs.matrix) }}

    steps:
      - name: Checkout CraftApps Repository
        uses: actions/checkout@v4
        with:
          path: craftapps

      - name: Checkout Upstream App (${{ matrix.app }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo || format('storytold/{0}', matrix.app) }}
          ref: ${{ matrix.branch || inputs.branch || 'main' }}
          path: app-repo

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo & Build Artifacts
        if: needs.check-changes.outputs.clean_build != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-repo -> target
          key: ${{ matrix.app }}-web-${{ inputs.branch || 'main' }}-${{ matrix.latest_sha }}

      - name: Install Trunk CLI
        shell: bash
        run: |
          TRUNK_VERSION="0.21.14"
          echo "Installing Trunk v${TRUNK_VERSION}..."
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" -o trunk.tar.gz
          tar -xzf trunk.tar.gz
          sudo mv trunk /usr/local/bin/
          trunk --version


      - name: Check out craft-fonts (if required)
        if: matrix.fonts_ref != ''
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ matrix.fonts_ref }}
          path: craft-fonts
          persist-credentials: false

      - name: Check out craft-i18n (if required)
        shell: bash
        run: |
          if [ -f app-repo/craft-i18n.rev ]; then
            REV=$(tr -d '[:space:]' < app-repo/craft-i18n.rev)
            echo "Checking out craft-i18n at commit ${REV}..."
            git clone --filter=blob:none https://github.com/storytold/craft-i18n.git craft-i18n
            (cd craft-i18n && git checkout "$REV")
            echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> $GITHUB_ENV
            echo "CRAFT_I18N_REQUIRED=1" >> $GITHUB_ENV
          fi

      - name: Build Web Target via Packaging Script
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ matrix.fonts_ref != '' && format('{0}/craft-fonts', github.workspace) || '' }}
          CRAFT_FONTS_REQUIRED: ${{ matrix.web_fonts && '1' || '' }}
          FIGCRAFT_WASM_MAX_BYTES: '52428800'
          PHOTOCRAFT_WEB_MAX_FILE_BYTES: '52428800'
        run: |
          python craftapps/scripts/build-upstream.py \
            --app ${{ matrix.app }} \
            --repo-dir app-repo \
            --output-dir output/${{ matrix.app }} \
            --commit-sha ${{ matrix.latest_sha }} \
            ${{ matrix.fonts_ref != '' && format('--fonts-dir {0}/craft-fonts', github.workspace) || '' }}

      - name: Upload Built App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app }}
          path: output/${{ matrix.app }}/
          retention-days: 1

  deploy:
    name: Assemble & Deploy to Firebase
    needs: [check-changes, build-apps]
    if: always() && needs.check-changes.outputs.has_changes == 'true' && needs.build-apps.result != 'cancelled' && (inputs.force_deploy == true || inputs.force_deploy == '' || github.event_name == 'schedule')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CraftApps Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Built App Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloaded-artifacts
          pattern: app-*
          merge-multiple: false

      - name: Restore Previous Successful Web Builds
        uses: actions/cache/restore@v4
        id: dist-cache
        with:
          path: dist
          key: craftapps-dist-${{ github.run_id }}
          restore-keys: |
            craftapps-dist-

      - name: Assemble Built Apps into dist/
        shell: bash
        run: |
          mkdir -p dist
          if [ -d downloaded-artifacts ]; then
            for d in downloaded-artifacts/app-*; do
              if [ -d "$d" ]; then
                app_name="${d##*downloaded-artifacts/app-}"
                echo "Replacing build files for $app_name with new build from main..."
                rm -rf "dist/$app_name"
                mkdir -p "dist/$app_name"
                cp -R "$d/." "dist/$app_name/"
              fi
            done
          fi

      - name: Prepare Root Portal Shell
        shell: bash
        run: |
          mkdir -p dist/icons
          cp index.html dist/index.html
          cp -R icons/. dist/icons/
          echo "Installed portal shell to dist/index.html and dist/icons/"

      - name: Update Tracked Commit Metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          latest_shas_str = '''${{ needs.check-changes.outputs.latest_shas }}'''
          if latest_shas_str:
              try:
                  latest_shas = json.loads(latest_shas_str)
                  built_apps = set()
                  if os.path.exists("downloaded-artifacts"):
                      for d in os.listdir("downloaded-artifacts"):
                          if d.startswith("app-"):
                              built_apps.add(d[4:])

                  commits_file = "upstream-commits.json"
                  current = {}
                  if os.path.exists(commits_file):
                      with open(commits_file, "r", encoding="utf-8") as f:
                          current = json.load(f)

                  updated_any = False
                  for app, sha in latest_shas.items():
                      if app in built_apps:
                          current[app] = sha
                          updated_any = True
                          print(f"Recorded updated SHA for {app}: {sha[:8]}")
                      else:
                          print(f"Skipping SHA for {app} (build failed; will retry on next check)")

                  if updated_any:
                      with open(commits_file, "w", encoding="utf-8") as f:
                          json.dump(current, f, indent=2, sort_keys=True)
                          f.write("\n")
                      print("Updated upstream-commits.json with successful SHAs")
              except Exception as e:
                  print("Warning: failed to update upstream-commits.json:", e)
          PY

      - name: Commit Updated Commit Hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream-commits.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(upstream): update tracked main commit SHAs [skip ci]"
            git push origin main
          else
            echo "upstream-commits.json is unchanged; skipping commit."
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRAFTAPPS }}
          projectId: craftapps
          channelId: live

      - name: Save Persistent Distribution Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: dist
          key: craftapps-dist-${{ github.run_id }}

      - name: Report Deployment Status
        shell: bash
        run: |
          python - <<'PY'
          import os, json

          built_apps = []
          if os.path.exists("downloaded-artifacts"):
              for d in os.listdir("downloaded-artifacts"):
                  if d.startswith("app-"):
                      built_apps.append(d[4:])
          built_apps.sort()

          latest_shas_str = '''${{ needs.check-changes.outputs.latest_shas }}'''
          queued_apps = []
          if latest_shas_str:
              try:
                  queued_apps = sorted(list(json.loads(latest_shas_str).keys()))
              except Exception:
                  pass

          failed_apps = [a for a in queued_apps if a not in built_apps]

          clean_build = "${{ needs.check-changes.outputs.clean_build }}" == "true"
          build_result = "${{ needs.build-apps.result }}"

          step_summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary_file:
              with open(step_summary_file, "a", encoding="utf-8") as f:
                  if build_result == "success":
                      if clean_build:
                          f.write("### 🧹 24h Clean Rebuild & Deployment Complete\n\n")
                          f.write("All 15 applications cleanly compiled from `main` and deployed to Firebase Hosting.\n\n")
                      else:
                          f.write("### 🚀 Deployed Updated Application(s) to Firebase Hosting\n\n")
                          f.write(f"Newly built from `main`: **{', '.join(built_apps)}**\n\n")
                  else:
                      f.write("### ⚠️ Partial Deployment: Some App Builds Failed\n\n")
                      f.write(f"✅ **Newly compiled & deployed from `main` ({len(built_apps)}):** {', '.join(built_apps) if built_apps else 'None'}\n\n")
                      if failed_apps:
                          f.write(f"❌ **Failed to compile from `main` ({len(failed_apps)}):** {', '.join(failed_apps)}\n\n")
                          f.write("> [!IMPORTANT]\n> Preserved previously successful builds for failed applications on the live website (zero release downloads). They will be retried automatically on the next scheduled run.\n\n")

                  f.write("Live suite accessible at: [craftapps.web.app](https://craftapps.web.app)\n")
          PY

      - name: Notify on App Build Failures
        if: always() && needs.build-apps.result != 'success'
        shell: bash
        run: |
          echo "::error title=Partial Build Failure::One or more applications failed to compile from main. Successfully built apps were deployed to Firebase Hosting, while failed apps continue running their previous successful build."
          echo "Triggering GitHub workflow failure notification..."
          exit 1
