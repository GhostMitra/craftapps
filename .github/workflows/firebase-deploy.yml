name: Deploy Portal to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'icons/**'
      - 'firebase.json'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy Portal Shell to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Persistent Web Distribution Cache
        uses: actions/cache/restore@v4
        id: dist-cache
        with:
          path: dist
          key: craftapps-dist-${{ github.run_id }}
          restore-keys: |
            craftapps-dist-

      - name: Prepare Root Portal Shell
        shell: bash
        run: |
          mkdir -p dist/icons
          cp index.html dist/index.html
          cp -R icons/. dist/icons/
          echo "Installed portal shell to dist/index.html and dist/icons/"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRAFTAPPS }}
          projectId: craftapps
          channelId: live

      - name: Save Persistent Web Distribution Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: dist
          key: craftapps-dist-${{ github.run_id }}
