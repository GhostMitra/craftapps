name: Sync Upstream Releases & Deploy

on:
  schedule:
    # Runs every 6 hours automatically to check for new releases
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download all apps even if version has not changed'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  check-and-update:
    name: Check & Deploy Upstream Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync from Upstream Repositories
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python scripts/sync-upstream.py $ARGS

      - name: Commit Updated Version Metadata
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(upstream): update versions metadata (${{ steps.sync.outputs.summary }})"
          git push origin main

      - name: Deploy to Firebase Hosting
        if: steps.sync.outputs.updated == 'true' || inputs.force == true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRAFTAPPS }}
          projectId: craftapps
          channelId: live

      - name: Report Sync Status
        run: |
          if [ "${{ steps.sync.outputs.updated }}" = "true" ]; then
            echo "### 🚀 Upstream Updates Deployed" >> $GITHUB_STEP_SUMMARY
            echo "Updated applications: **${{ steps.sync.outputs.summary }}**" >> $GITHUB_STEP_SUMMARY
            echo "Deployed automatically to Firebase Hosting & Cloudflare Custom Subdomains." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ All Applications Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "No new web releases found on \`storytold/*\` repositories." >> $GITHUB_STEP_SUMMARY
          fi
