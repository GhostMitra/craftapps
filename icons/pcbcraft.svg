<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PCBCraft Icon: PCB Circuit Board with IC Chip, Copper Traces, and Solder Pads -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="icGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <!-- Board Base -->
    <rect width="512" height="512" fill="url(#pcbBg)"/>
    
    <!-- PCB Grid Matrix Points -->
    <g fill="#10b981" opacity="0.15">
      <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/><circle cx="320" cy="80" r="3"/><circle cx="400" cy="80" r="3"/>
      <circle cx="80" cy="160" r="3"/><circle cx="400" cy="160" r="3"/>
      <circle cx="80" cy="240" r="3"/><circle cx="400" cy="240" r="3"/>
      <circle cx="80" cy="320" r="3"/><circle cx="400" cy="320" r="3"/>
      <circle cx="80" cy="400" r="3"/><circle cx="160" cy="400" r="3"/><circle cx="240" cy="400" r="3"/><circle cx="320" cy="400" r="3"/><circle cx="400" cy="400" r="3"/>
    </g>

    <!-- Copper Traces (Gold / Amber) -->
    <g fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- Top Left Trace -->
      <path d="M 80 120 L 160 120 L 210 170 L 210 200"/>
      <!-- Top Right Trace -->
      <path d="M 432 100 L 360 100 L 302 158 L 302 200"/>
      <!-- Bottom Left Trace -->
      <path d="M 90 390 L 170 390 L 210 350 L 210 312"/>
      <!-- Bottom Right Trace -->
      <path d="M 420 380 L 350 380 L 302 332 L 302 312"/>
      <!-- Side Horizontal Traces -->
      <path d="M 70 256 L 200 256"/>
      <path d="M 442 256 L 312 256"/>
    </g>

    <!-- Solder Pads / Vias (Outer Gold, Inner Dark Hole) -->
    <g stroke="#f59e0b" stroke-width="5" fill="#047857">
      <circle cx="80" cy="120" r="14"/><circle cx="80" cy="120" r="6" fill="#022c22" stroke="none"/>
      <circle cx="432" cy="100" r="14"/><circle cx="432" cy="100" r="6" fill="#022c22" stroke="none"/>
      <circle cx="90" cy="390" r="14"/><circle cx="90" cy="390" r="6" fill="#022c22" stroke="none"/>
      <circle cx="420" cy="380" r="14"/><circle cx="420" cy="380" r="6" fill="#022c22" stroke="none"/>
      <circle cx="70" cy="256" r="14"/><circle cx="70" cy="256" r="6" fill="#022c22" stroke="none"/>
      <circle cx="442" cy="256" r="14"/><circle cx="442" cy="256" r="6" fill="#022c22" stroke="none"/>
      
      <!-- Additional board vias -->
      <circle cx="140" cy="200" r="10"/><circle cx="140" cy="200" r="4" fill="#022c22" stroke="none"/>
      <circle cx="372" cy="312" r="10"/><circle cx="372" cy="312" r="4" fill="#022c22" stroke="none"/>
      <circle cx="350" cy="200" r="10"/><circle cx="350" cy="200" r="4" fill="#022c22" stroke="none"/>
    </g>

    <!-- Central Microchip IC -->
    <!-- Pins (Silver / Metallic) -->
    <g fill="#cbd5e1">
      <!-- Top Pins -->
      <rect x="220" y="186" width="12" height="20" rx="3"/>
      <rect x="250" y="186" width="12" height="20" rx="3"/>
      <rect x="280" y="186" width="12" height="20" rx="3"/>
      <!-- Bottom Pins -->
      <rect x="220" y="306" width="12" height="20" rx="3"/>
      <rect x="250" y="306" width="12" height="20" rx="3"/>
      <rect x="280" y="306" width="12" height="20" rx="3"/>
      <!-- Left Pins -->
      <rect x="186" y="220" width="20" height="12" rx="3"/>
      <rect x="186" y="250" width="20" height="12" rx="3"/>
      <rect x="186" y="280" width="20" height="12" rx="3"/>
      <!-- Right Pins -->
      <rect x="306" y="220" width="20" height="12" rx="3"/>
      <rect x="306" y="250" width="20" height="12" rx="3"/>
      <rect x="306" y="280" width="20" height="12" rx="3"/>
    </g>

    <!-- IC Body -->
    <rect x="200" y="200" width="112" height="112" rx="14" fill="url(#icGrad)" stroke="#475569" stroke-width="3"/>
    <!-- Pin 1 Notch / Index Dot -->
    <circle cx="218" cy="218" r="5" fill="#64748b"/>
    <!-- Chip Silkscreen Label -->
    <text x="256" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PCB</text>
  </g>
</svg>
