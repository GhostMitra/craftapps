<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ProjectCraft application icon (UCS Care Group): Gantt chart project scheduling, milestones & critical path method (CPM).
       Palette: MS Project green #317256 / #1b4935, ink #0b0b0c, paper #efe9dc, milestone gold #f59e0b -->
  <defs>
    <clipPath id="tile-project"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="project-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#317256"/>
      <stop offset="100%" stop-color="#1b4935"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile-project)">
    <rect width="512" height="512" fill="url(#project-bg)"/>

    <g transform="rotate(-5 256 256)" stroke="#0b0b0c" stroke-linejoin="round" stroke-linecap="round">
      <!-- Project Planning Board -->
      <rect x="88" y="76" width="336" height="360" rx="20" fill="#efe9dc" stroke-width="14"/>

      <!-- Header band -->
      <path d="M 88 76 H 424 V 132 H 88 Z" fill="#317256" stroke="none"/>
      <!-- Header calendar months indicators -->
      <rect x="110" y="92" width="60" height="24" rx="4" fill="#efe9dc" stroke="none"/>
      <rect x="185" y="92" width="60" height="24" rx="4" fill="#efe9dc" stroke="none"/>
      <rect x="260" y="92" width="60" height="24" rx="4" fill="#efe9dc" stroke="none"/>
      <rect x="335" y="92" width="70" height="24" rx="4" fill="#efe9dc" stroke="none"/>

      <!-- Gantt grid timeline rules -->
      <g stroke="#0b0b0c" stroke-opacity="0.15" stroke-width="4">
        <!-- Vertical week dividers -->
        <line x1="175" y1="132" x2="175" y2="436"/>
        <line x1="250" y1="132" x2="250" y2="436"/>
        <line x1="325" y1="132" x2="325" y2="436"/>
        <!-- Horizontal task rows -->
        <line x1="88" y1="192" x2="424" y2="192"/>
        <line x1="88" y1="252" x2="424" y2="252"/>
        <line x1="88" y1="312" x2="424" y2="312"/>
        <line x1="88" y1="372" x2="424" y2="372"/>
      </g>

      <!-- Task Row 1: Summary / Phase 1 -->
      <rect x="110" y="152" width="160" height="26" rx="6" fill="#317256" stroke-width="8"/>
      <!-- Summary brackets -->
      <path d="M 110 178 L 118 184 L 126 178 M 270 178 L 262 184 L 254 178" fill="#317256" stroke="none"/>

      <!-- Task Row 2: Subtask on Critical Path -->
      <rect x="140" y="212" width="130" height="24" rx="5" fill="#e11d48" stroke-width="7"/>
      <!-- Dependency arrow down to Task 3 -->
      <path d="M 270 224 H 290 V 278 H 296" fill="none" stroke="#e11d48" stroke-width="6"/>
      <polygon points="296,274 304,278 296,282" fill="#e11d48" stroke="none"/>

      <!-- Task Row 3: Subtask 2 -->
      <rect x="304" y="272" width="90" height="24" rx="5" fill="#317256" stroke-width="7"/>

      <!-- Task Row 4: Parallel Sprint -->
      <rect x="180" y="332" width="110" height="24" rx="5" fill="#0284c7" stroke-width="7"/>

      <!-- Milestones (Diamonds) -->
      <!-- Milestone 1 -->
      <polygon points="290,165 304,151 318,165 304,179" fill="#f59e0b" stroke="#0b0b0c" stroke-width="7"/>
      <!-- Milestone 2 (Project Launch) -->
      <polygon points="380,392 396,376 412,392 396,408" fill="#f59e0b" stroke="#0b0b0c" stroke-width="7"/>

      <!-- Status indicator progress check -->
      <circle cx="124" cy="224" r="10" fill="#059669" stroke="#0b0b0c" stroke-width="4"/>
      <polyline points="119,224 123,228 129,220" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>
</svg>